<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Bills and reminders · Mara, resident owner</title><desc id="desc">Low-fidelity home bills overview with upcoming expenses, a sample recorded payment with proof, and an extracted due date that requires review before a reminder can be confirmed. Design illustration only.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="#f5f4ef" stroke="#f5f4ef"/><rect x="0" y="0" width="960" height="65" rx="0" fill="#fffefa" stroke="#d4d6cf"/><text x="26" y="40" font-size="24" fill="#29312c" font-weight="700">firstflat.</text><text x="216" y="39" font-size="14" fill="#58615b" font-weight="400">My home / Sample apartment</text><rect x="674" y="20" width="146" height="28" rx="14" fill="#eceee7" stroke="#d4d6cf"/><text x="686" y="39" font-size="12" fill="#29312c" font-weight="600">SAMPLE CONTENT</text><text x="842" y="39" font-size="14" fill="#29312c" font-weight="600">Mara</text><rect x="24" y="88" width="168" height="505" rx="10" fill="#fffefa" stroke="#d4d6cf"/><text x="42" y="120" font-size="12" fill="#58615b" font-weight="600">YOUR WORKSPACE</text><text x="46" y="166" font-size="13" fill="#58615b" font-weight="400">Overview</text><text x="46" y="215" font-size="13" fill="#58615b" font-weight="400">Expenses</text><rect x="35" y="240" width="146" height="38" rx="6" fill="#eceee7" stroke="#d4d6cf"/><text x="46" y="264" font-size="13" fill="#29312c" font-weight="600">Bills &amp; reminders</text><text x="46" y="313" font-size="13" fill="#58615b" font-weight="400">Documents</text><text x="46" y="362" font-size="13" fill="#58615b" font-weight="400">Handover</text><path d="M42 425H174" fill="none" stroke="#d4d6cf"/><text x="42" y="453" font-size="12" fill="#58615b" font-weight="600">DESIGN PERSONA</text><text x="42" y="480" font-size="18" fill="#29312c" font-weight="600">Mara</text><text x=