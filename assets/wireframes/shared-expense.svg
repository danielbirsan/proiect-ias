<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Shared expense · Alex, tenant</title><desc id="desc">Low-fidelity example of a shared repair expense: a 300 lei invoice, proposed equal split, attached receipt, pending landlord confirmation, and activity history. Design illustration only.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="640" rx="0" fill="#f5f4ef" stroke="#f5f4ef"/><rect x="0" y="0" width="960" height="65" rx="0" fill="#fffefa" stroke="#d4d6cf"/><text x="26" y="40" font-size="24" fill="#29312c" font-weight="700">firstflat.</text><text x="216" y="39" font-size="14" fill="#58615b" font-weight="400">My home / Sample apartment</text><rect x="674" y="20" width="146" height="28" rx="14" fill="#eceee7" stroke="#d4d6cf"/><text x="686" y="39" font-size="12" fill="#29312c" font-weight="600">SAMPLE CONTENT</text><text x="842" y="39" font-size="14" fill="#29312c" font-weight="600">Alex</text><rect x="24" y="88" width="168" height="505" rx="10" fill="#fffefa" stroke="#d4d6cf"/><text x="42" y="120" font-size="12" fill="#58615b" font-weight="600">YOUR WORKSPACE</text><text x="46" y="166" font-size="13" fill="#58615b" font-weight="400">Overview</text><rect x="35" y="191" width="146" height="38" rx="6" fill="#eceee7" stroke="#d4d6cf"/><text x="46" y="215" font-size="13" fill="#29312c" font-weight="600">Expenses</text><text x="46" y="264" font-size="13" fill="#58615b" font-weight="400">Bills &amp; reminders</text><text x="46" y="313" font-size="13" fill="#58615b" font-weight="400">Documents</text><text x="46" y="362" font-size="13" fill="#58615b" font-weight="400">Handover</text><path d="M42 425H174" fill="none" stroke="#d4d6cf"/><text x="42" y="453" font-size="12" fill="#58615b" font-weight="600">DESIGN PERSONA</text><text x="42" y="480" font-size="18" fill="#29312c" font-weight="600">Alex</text><text x="42" y="503" font-size="13" fill="#58615b" font-weight="400">Tenant</text><text x="42" y="552" font-size="12" fill="#58615b" font-weight="600">ONE HOME</text><text x="42" y="575" font-size="13" fill="#58615b" font-weight="400">Shared records</text><text x="24" y="620" font-size="12" fill="#58615b" font-weight="600">LOW-FIDELITY WIREFRAME</text><text x="425" y="620" font-size="12" fill="#58615b" font-weight="400">Illustrative screen · controls are design elements</text><text x="216" y="112" font-size="24" fill="#29312c" font-weight="600">One expense. One shared record.</text><text x="216" y="140" font-size="14" fill="#58615b" font-weight="400">Keep the invoice, proposed split, and conversation together.</text><rect x="216" y="161" width="444" height="357" rx="10" fill="#fffefa" stroke="#d4d6cf"/><text x="238" y="192" font-size="16" fill="#29312c" font-weight="600">Kitchen tap repair</text><rect x="498" y="179" width="140" height="28" rx="14" fill="#f4e8df" stroke="#d9bda9"/><text x="510" y="198" font-size="12" fill="#965037" font-weight="600">Review pending</text><text x="240" y="229" font-size="12" fill="#58615b" font-weight="600">TOTAL EXPENSE</text><text x="240" y="266" font-size="32" fill="#29312c" font-weight="600">300.00 lei</text><text x="456" y="235" font-size="13" fill="#58615b" font-weight="400">Recorded by Alex</text><text x="456" y="257" font-size="12" fill="#58615b" font-weight="400">12 Nov 2026 · sample</text><path d="M240 286H636" fill="none" stroke="#d4d6cf"/><text x="240" y="313" font-size="12" fill="#58615b" font-weight="600">PROPOSED SPLIT</text><text x="240" y="340" font-size="14" fill="#29312c" font-weight="600">Alex · tenant</text><text x="536" y="340" font-size="14" fill="#29312c" font-weight="600">150.00 lei</text><text x="240" y="366" font-size="14" fill="#29312c" font-weight="600">Radu · landlord</text><text x="536" y="366" font-size="14" fill="#29312c" font-weight="600">150.00 lei</text><rect x="240" y="389" width="396" height="64" rx="6" fill="#eceee7" stroke="#d4d6cf"/><text x="255" y="413" font-size="14" fill="#29312c" font-weight="600">repair-receipt.pdf</text><text x="255" y="436" font-size="12" fill="#58615b" font-weight="400">Original attachment · sample document</text><rect x="240" y="470" width="174" height="36" rx="6" fill="#fffefa" stroke="#d4d6cf"/><text x="254" y="493" font-size="13" fill="#29312c" font-weight="600">Edit proposed split</text><text x="433" y="493" font-size="12" fill="#58615b" font-weight="400">Payment not recorded.</text><rect x="680" y="161" width="256" height="357" rx="10" fill="#fffefa" stroke="#d4d6cf"/><text x="702" y="192" font-size="16" fill="#29312c" font-weight="600">Review with Radu</text><text x="702" y="224" font-size="13" fill="#58615b" font-weight="400">Other person’s status</text><rect x="702" y="238" width="182" height="28" rx="14" fill="#f4e8df" stroke="#d9bda9"/><text x="714" y="257" font-size="12" fill="#965037" font-weight="600">Awaiting confirmation</text><text x="702" y="300" font-size="14" fill="#29312c" font-weight="600">The split is a proposal.</text><text x="702" y="325" font-size="13" fill="#58615b" font-weight="400">Radu can accept it or</text><text x="702" y="346" font-size="13" fill="#58615b" font-weight="400">suggest a different share.</text><path d="M702 366H914" fill="none" stroke="#d4d6cf"/><text x="702" y="394" font-size="13" fill="#58615b" font-weight="400">Linked agreement</text><text x="702" y="418" font-size="14" fill="#29312c" font-weight="600">Rental agreement.pdf</text><rect x="702" y="454" width="212" height="36" rx="6" fill="#29312c" stroke="#29312c"/><text x="716" y="477" font-size="13" fill="#fffefa" font-weight="600">Request confirmation</text><rect x="216" y="538" width="720" height="55" rx="10" fill="#fffefa" stroke="#d4d6cf"/><text x="236" y="559" font-size="12" fill="#58615b" font-weight="600">ACTIVITY</text><text x="236" y="581" font-size="13" fill="#29312c" font-weight="400">Invoice attached → Split proposed → Waiting for Radu’s review</text></g></svg>
